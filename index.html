<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Basketball Scoreboard</title>
        <link rel="stylesheet" href="public/build/app.css">
    </head>

    <body>

        <div class="container">
            
            <div class="scoreboard-team-column">
                
                <h3>
                    HOME
                </h3>
                
                <div class="scoreboard-count">
                    <span id="home-count">
                        0
                    </span>
                </div>
                
                <div class="button-group">
                    
                    <button type="button" class="score-increment-btn" id="add-one-point-home" onclick="incrementHomeOne()">
                        +1
                    </button>
                    
                    <button type="button" class="score-increment-btn" id="add-two-points-home" onclick="incrementHomeTwo()">
                        +2
                    </button>
                    
                    <button type="button" class="score-increment-btn" id="add-three-point-home" onclick="incrementHomeThree()">
                        +3
                    </button>
                    
                </div>
                
            </div>
            
            <div class="scoreboard-team-column">
                
                <h3>
                    GUEST
                </h3>
                
                <div class="scoreboard-count">
                    <span id="guest-count">
                        0
                    </span>
                </div>
                
                <div class="button-group">
                    
                    <button type="button" class="score-increment-btn" id="add-one-point-guest" onclick="incrementGuestOne()">
                        +1
                    </button>
                    
                    <button type="button" class="score-increment-btn" id="add-two-points-guest" onclick="incrementGuestTwo()">
                        +2
                    </button>
                    
                    <button type="button" class="score-increment-btn" id="add-three-point-guest" onclick="incrementGuestThree()">
                        +3
                    </button>
                    
                </div>
                
            </div>
            
        </div>

        <script src="assets/js/app.js"></script>

    </body>
    
</html>
